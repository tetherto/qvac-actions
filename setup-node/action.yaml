name: Setup Node
description: actions/setup-node, pinned once. No package-manager cache unless asked.

inputs:
  node-version:
    description: Node.js version or alias
    default: lts/*
  registry-url:
    description: Registry to write into .npmrc
    default: ""
  scope:
    description: Scope for the registry
    default: ""
  package-manager-cache:
    description: Let setup-node cache the package manager store
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        package-manager-cache: ${{ inputs.package-manager-cache }}
