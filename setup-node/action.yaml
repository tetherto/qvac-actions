name: Setup Node
description: actions/setup-node, pinned once. Checks for the newest matching Node so a runner's tool cache never serves a stale one. No package-manager cache unless asked.

inputs:
  node-version:
    description: Node.js version or alias, e.g. 24 or lts/*
    required: true
  check-latest:
    description: Resolve the version against the Node.js manifest before any cached copy; self-hosted caches persist
    default: "true"
  registry-url:
    description: Registry to write into .npmrc
    default: ""
  scope:
    description: Scope for the registry
    default: ""
  package-manager-cache:
    description: Let setup-node cache the package manager store; ignored on events cache-save refuses
    default: "false"

outputs:
  node-version:
    description: The installed Node.js version
    value: ${{ steps.node.outputs.node-version }}
  cache-hit:
    description: Whether the package manager cache was restored
    value: ${{ steps.node.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: ${{ inputs.check-latest }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        # The cache saves after the job, so it is off on any event cache-save refuses (pull_request_target,
        # workflow_run, ...): those would write into the base branch's cache.
        package-manager-cache: ${{ contains(fromJSON('["push","workflow_dispatch","merge_group","schedule","pull_request"]'), github.event_name) && inputs.package-manager-cache || 'false' }}
