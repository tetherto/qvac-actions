name: Cache save
description: actions/cache/save, pinned once. Refuses pull_request_target, where a save would poison the base branch's cache.

inputs:
  path:
    description: Newline-separated paths to save
    required: true
  key:
    description: Cache key
    required: true

runs:
  using: composite
  steps:
    # On pull_request_target a save lands in the base branch's scope, where every later run restores it.
    - if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::cache-save refuses pull_request_target; use cache-restore there"
        exit 1
    - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
