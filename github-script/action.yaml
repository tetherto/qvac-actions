name: GitHub script
description: actions/github-script, pinned once.

inputs:
  script:
    description: JavaScript to run, with github, context and core in scope
    required: true
  github-token:
    description: Token for the github client
    default: ${{ github.token }}
  result-encoding:
    description: How the return value is encoded, json or string
    default: json
  retries:
    description: Times to retry a failed request
    default: "0"

outputs:
  result:
    description: The script's return value
    value: ${{ steps.script.outputs.result }}

runs:
  using: composite
  steps:
    - id: script
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # 8.0.0
      with:
        script: ${{ inputs.script }}
        github-token: ${{ inputs.github-token }}
        result-encoding: ${{ inputs.result-encoding }}
        retries: ${{ inputs.retries }}
