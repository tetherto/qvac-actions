name: Setup Android
description: android-actions/setup-android, pinned once. A runner with the SDK already licensed only gets it on PATH.

inputs:
  packages:
    description: sdkmanager packages to install when the runner has no SDK
    default: platform-tools

runs:
  using: composite
  steps:
    - id: sdk
      shell: bash
      run: |
        if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/platform-tools/adb" ] && [ -e "$ANDROID_HOME/licenses/android-sdk-license" ]; then
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -1 >> "$GITHUB_PATH"
          echo "preprovisioned=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.sdk.outputs.preprovisioned != 'true'
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # 4.0.4
      with:
        packages: ${{ inputs.packages }}
