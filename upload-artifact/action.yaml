name: Upload artifact
description: actions/upload-artifact, pinned once. Every value comes from the caller.

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Newline-separated files or directories to upload
    required: true
  retention-days:
    description: Days to keep the artifact; empty uses the repository default
    default: ""
  if-no-files-found:
    description: warn, error or ignore
    default: error
  overwrite:
    description: Replace an artifact with the same name
    default: "false"

outputs:
  artifact-id:
    description: Id of the uploaded artifact
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: ${{ inputs.overwrite }}
