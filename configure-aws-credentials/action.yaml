name: Configure AWS
description: aws-actions/configure-aws-credentials over OIDC, pinned once. Jobs call it, actions never do.

inputs:
  role-to-assume:
    description: ARN of the role to assume
    required: true
  aws-region:
    description: AWS region
    required: true
  role-duration-seconds:
    description: Session length in seconds
    default: "3600"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
