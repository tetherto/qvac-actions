name: Configure AWS
description: aws-actions/configure-aws-credentials over OIDC, pinned once. Jobs call it, actions never do.

inputs:
  role-to-assume:
    description: ARN of the role to assume
    required: true
  aws-region:
    description: AWS region
    required: true
  role-duration-seconds:
    description: Session length in seconds
    default: "3600"

outputs:
  aws-account-id:
    description: The AWS account id of the assumed role
    value: ${{ steps.aws.outputs.aws-account-id }}

runs:
  using: composite
  steps:
    - id: aws
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # 6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
