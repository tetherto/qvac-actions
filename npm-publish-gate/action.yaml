name: npm Publish Gate
description: >
  Single-responsibility gate: decides whether npm publishing should proceed.
  Outputs should_publish=false for graceful-skip cases (dev/tmp tags,
  non-release branches, or a version already on npm). Hard-fails only on
  unexpected branch violations or an unexpected npm registry error.
  Keeps dist-tag-determination and publish-library-to-npm assertion-free.

inputs:
  tag:
    description: "Resolved npm dist-tag (from dist-tag-determination)."
    required: true
  workdir:
    description: "Directory containing package.json (used to check if the version is already published)."
    required: true

outputs:
  should_publish:
    description: "'true' when all conditions are met for npm publish, 'false' to skip gracefully."
    value: ${{ steps.gate.outputs.should_publish }}

runs:
  using: composite
  steps:
    - name: Evaluate publish gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RESOLVED_TAG: ${{ inputs.tag }}
        GHA_REF: ${{ github.ref }}
      run: |
        set -euo pipefail

        # Non-production tags → graceful skip (no error).
        # npm-dist-tag-determination never emits "dev"/"tmp"; this branch fires only when a
        # caller passes those tags directly (e.g. a PR-event job that hard-codes tag: "dev").
        if [ "${RESOLVED_TAG}" = "dev" ] || [ "${RESOLVED_TAG}" = "tmp" ]; then
          echo "Skipping npm publish: non-production tag '${RESOLVED_TAG}'"
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # OIDC npm publish requires a release-* branch.
        if [[ "${GHA_REF}" != refs/heads/release-* ]]; then
          echo "::error title=npm-publish-gate::Expected a release-* branch, got '${GHA_REF}'. Callers must gate on release-* refs before calling this action."
          exit 1
        fi

        # Idempotency guard: skip if this exact version is already on npm.
        # A re-run on release-* (e.g. a follow-up pin/fix merge that re-fires the publish job)
        # would otherwise `npm publish` over an existing version and hard-fail with
        # "cannot publish over previously published versions", aborting downstream jobs.
        # Already published → graceful skip (should_publish=false); publish-library-to-npm
        # then emits an empty npm_published_version, and downstream jobs still run.
        PKG_NAME=$(node -p "require('./package.json').name")
        PKG_VERSION=$(node -p "require('./package.json').version")

        # Query the registry with --json for structured error detection.
        # E404 (package not yet published) → nothing to collide with → proceed to publish.
        # Any other failure (5xx, network, rate-limit) → fail loudly; never publish blind.
        # Stderr is kept separate so stray "npm warn" lines don't corrupt the JSON stdout.
        set +e
        NPM_JSON=$(npm view "${PKG_NAME}" versions --json 2>/tmp/npm-view-gate-err)
        NPM_RC=$?
        set -e

        if [ "${NPM_RC}" -ne 0 ]; then
          if ! node -e '
            try {
              const e = JSON.parse(process.argv[1]).error;
              process.exit(e && e.code === "E404" ? 0 : 1);
            } catch (_) { process.exit(1); }
          ' "${NPM_JSON}" 2>/dev/null; then
            echo "::error title=npm view failed (exit ${NPM_RC})::Could not query published versions for ${PKG_NAME}. Re-run after the registry recovers." >&2
            cat /tmp/npm-view-gate-err >&2
            echo "${NPM_JSON}" >&2
            exit 1
          fi
          # Package has never been published → safe to publish this version.
        else
          # `npm view <pkg> versions --json` returns a JSON array, or a bare JSON string
          # when the package has exactly one published version.
          ALREADY_PUBLISHED=$(node -e '
            const target = process.argv[1];
            let versions;
            try { versions = JSON.parse(process.argv[2]); } catch (_) { versions = []; }
            if (typeof versions === "string") versions = [versions];
            if (!Array.isArray(versions)) versions = [];
            process.stdout.write(versions.includes(target) ? "true" : "false");
          ' "${PKG_VERSION}" "${NPM_JSON}")

          if [ "${ALREADY_PUBLISHED}" = "true" ]; then
            echo "Skipping npm publish: ${PKG_NAME}@${PKG_VERSION} is already published to npm."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        echo "should_publish=true" >> "$GITHUB_OUTPUT"
