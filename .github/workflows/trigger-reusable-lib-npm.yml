# TEMPLATE to paste into other repos
name: General CI/CD
# This workflow is used to call the reusable workflows in the qvac-devops repository
# https://github.com/tetherto/qvac-devops/blob/v1.1.1/.github/workflows/public-reusable.yaml

on:
  push:
  # TODO: uncomment this when using this workflow in other repos
  # branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      custom_input_1:
        required: false
        type: string
      custom_input_2:
        required: false
        type: string
      custom_input_3:
        required: false
        type: string

# Covers the called jobs: npm publish with provenance (packages, id-token).
permissions:
  contents: read
  packages: write
  id-token: write

# Publishes mutate state, so runs on one ref queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call-devops-lib:
    uses: tetherto/qvac-devops/.github/workflows/public-reusable-npm.yml@bc74b700619e8746bf553dd9914f1aec9b354286 # v1.1.1
    secrets: inherit
