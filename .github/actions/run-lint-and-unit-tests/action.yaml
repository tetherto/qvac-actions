name: Run lint & unit tests
description: "Run linting and unit tests"

inputs:
  npm-token:
    description: "Auth token for registry.npmjs.org (for @qvac/*)"
    required: false
  gpr-token:
    description: "Auth token for GitHub Packages (for @tetherto/*) — can be the GitHub Actions GITHUB_TOKEN"
    required: true
  pat-token:
    description: "Optional PAT for fetching GitHub deps via HTTPS (git dependencies)"
    required: false
  registry-type:
    description: "Type of registry to use"
    required: true
    default: "gpr"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 4.4.0
      with:
        node-version: lts/*
        check-latest: true

    # Saves only on the events cache-save allows; any other event (pull_request_target, workflow_run, ...) would
    # write into the base branch's cache, so it restores only.
    - name: Restore npm cache
      id: cache-npm
      if: contains(fromJSON('["push","workflow_dispatch","merge_group","schedule","pull_request"]'), github.event_name)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # 4.3.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    - name: Restore npm cache (restore only)
      id: cache-npm-restore
      if: ${{ !contains(fromJSON('["push","workflow_dispatch","merge_group","schedule","pull_request"]'), github.event_name) }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # 4.3.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Configure .npmrc for both npmjs and GitHub Packages
      run: |
        # Clean slate .npmrc in workspace
        : > .npmrc

        # Default public registry
        echo "registry=https://registry.npmjs.org/" >> .npmrc

        # @qvac/* from npmjs.org
        echo "@qvac:registry=https://registry.npmjs.org/" >> .npmrc
        echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" >> .npmrc

        # @tetherto/* from GitHub Packages
        echo "@tetherto:registry=https://npm.pkg.github.com/" >> .npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.pat-token }}" >> .npmrc

        # If you use git+https deps, rewrite to include a PAT for private repos
        if [ -n "${{ inputs.pat-token }}" ]; then
          git config --global url."https://${{ inputs.pat-token }}:@github.com/".insteadOf "https://github.com/"
        fi
      shell: bash
    - name: Install dependencies
      shell: bash
      run: npm install
    - name: Run linting
      shell: bash
      run: npm run lint
    - name: Install bare
      shell: bash
      run: npm install -g bare
    - name: Run tests
      shell: bash
      run: npm run test:unit --if-present
