name: Setup Java
description: actions/setup-java, pinned once.

inputs:
  java-version:
    description: Java version
    required: true
  distribution:
    description: JDK distribution
    default: temurin

outputs:
  distribution:
    description: The installed JDK distribution
    value: ${{ steps.java.outputs.distribution }}
  version:
    description: The installed JDK version
    value: ${{ steps.java.outputs.version }}
  path:
    description: Path to the installed JDK
    value: ${{ steps.java.outputs.path }}
  cache-hit:
    description: Whether the dependency cache was restored
    value: ${{ steps.java.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
