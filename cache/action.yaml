name: Cache
description: actions/cache, pinned once. Saves only on push, workflow_dispatch, merge_group, schedule and pull_request; any other event would write into the base branch's cache.

inputs:
  path:
    description: Newline-separated paths to cache
    required: true
  key:
    description: Cache key
    required: true
  restore-keys:
    description: Newline-separated prefixes to fall back to
    default: ""
  lookup-only:
    description: Check for an entry without downloading it
    default: "false"
  enable-cross-os-archive:
    description: Let Windows restore an entry saved on Linux or macOS
    default: "false"

outputs:
  cache-hit:
    description: Whether the exact key was found
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Any other event (pull_request_target, workflow_run, issue_comment, ...) saves into the base branch's scope.
    - if: ${{ !contains(fromJSON('["push","workflow_dispatch","merge_group","schedule","pull_request"]'), github.event_name) }}
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        echo "::error::cache does not save on $EVENT; use cache-restore there"
        exit 1
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
        enableCrossOsArchive: ${{ inputs.enable-cross-os-archive }}
        lookup-only: ${{ inputs.lookup-only }}
